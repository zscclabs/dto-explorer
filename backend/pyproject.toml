[project]
name = "dto-explorer"
version = "0.1.0"
description = "AWS Data Transfer Out explorer backed by Cost Explorer"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.35",
    "pydantic-settings>=2.4",
    "cachetools>=5.5",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
